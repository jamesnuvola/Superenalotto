name: SONAR test 1 motif setting performance
on:
  push:
    paths:
      - 'scripts/test-number1-motif-setting.mjs'
      - '.github/workflows/test-number1-motif-setting.yml'
      - 'src/data/draws.js'
      - 'src/engine/scoring.js'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare ESM imports
        run: sed -i "s|'../engine/scoring'|'../engine/scoring.js'|g" src/engine/scoring.js
      - run: node scripts/test-number1-motif-setting.mjs > SONAR_number1_motif_setting_25settembre2026.md
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SONAR_number1_motif_setting_25settembre2026.md
          git diff --staged --quiet || git commit -m "Test number 1 motif setting performance"
          git push
