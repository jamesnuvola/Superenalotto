name: SONAR persistent DOT worker
on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: sonar-superenalotto-autonomous-research
  cancel-in-progress: false
jobs:
  dot-worker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: |
          node --check scripts/sonar-strategy-library.mjs
          node --check scripts/sonar-research-engine.mjs
      - name: Run persistent SONAR DOT agents
        run: BUDGET=16 WINDOW=228 node scripts/sonar-research-engine.mjs
      - name: Commit research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SONAR_superenalotto_research_state.json SONAR_superenalotto_autonomous_research_report.md
          git diff --staged --quiet || git commit -m "Advance persistent SONAR DOT queue"
          git push
