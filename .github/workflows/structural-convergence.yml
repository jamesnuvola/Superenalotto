name: SONAR structural convergence backtest
on:
  push:
    paths:
      - 'scripts/structural-convergence-ablation.mjs'
      - 'scripts/vincicasa-port-test.mjs'
      - '.github/workflows/structural-convergence.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare ESM imports for Node
        run: |
          sed -i "s|'../engine/scoring'|'../engine/scoring.js'|g; s|'./scoring'|'./scoring.js'|g; s|'./dominant-band'|'./dominant-band.js'|g" src/engine/multigen.js src/engine/dominant-band.js
      - name: Run VinciCasa strategy port
        run: node scripts/vincicasa-port-test.mjs
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SONAR_vincicasa_port_superenalotto_2026-10-02.md
          git diff --staged --quiet || git commit -m "Backtest VinciCasa strategies on SuperEnalotto"
          git push
