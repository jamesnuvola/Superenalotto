name: SONAR structural convergence backtest
on:
  push:
    paths:
      - 'scripts/structural-convergence-ablation.mjs'
      - 'scripts/vincicasa-port-test.mjs'
      - 'scripts/vincicasa-regime-test.mjs'
      - '.github/workflows/structural-convergence.yml'
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare ESM imports for Node
        run: |
          sed -i "s|'../engine/scoring'|'../engine/scoring.js'|g; s|'./scoring'|'./scoring.js'|g; s|'./dominant-band'|'./dominant-band.js'|g" src/engine/multigen.js src/engine/dominant-band.js
      - name: Defensive patches for port test
        run: |
          sed -i 's/occ.get(n).push(i)/(occ.get(n)||[]).push(i)/' scripts/vincicasa-port-test.mjs
          sed -i 's/const a=occ.get(n), g=/const a=occ.get(n)||[], g=/' scripts/vincicasa-port-test.mjs
          sed -i 's/new Map(nums().map(n=>.35\*(nuc\[p\].get(n)||0)+.30\*(rel.pairs.get(n)||0)+.10\*(rel.triples.get(n)||0)+.15\*(rel.pos\[p\].get(n)||0)+.10\*freq.get(n)))/new Map(nums().map(n=>[n,.35*(nuc[p].get(n)||0)+.30*(rel.pairs.get(n)||0)+.10*(rel.triples.get(n)||0)+.15*(rel.pos[p].get(n)||0)+.10*freq.get(n)]))/' scripts/vincicasa-port-test.mjs
          sed -i 's/function relationScores(h){/function relationScores(h){h=h.slice(-200);/' scripts/vincicasa-port-test.mjs
          sed -i 's/function nucleusScores(h,i){/function nucleusScores(h,i){h=h.slice(-120);/' scripts/vincicasa-port-test.mjs
      - name: Run VinciCasa strategy port
        run: START=2700 node scripts/vincicasa-port-test.mjs
      - name: Run regime-conditioned port
        run: START=2700 node scripts/vincicasa-regime-test.mjs
      - name: Commit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SONAR_vincicasa_port_superenalotto_2026-10-02.md SONAR_vincicasa_regime_superenalotto_2026-10-02.md
          git diff --staged --quiet || git commit -m "Backtest VinciCasa strategies by regime"
          git push