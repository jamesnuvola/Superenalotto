name: Aggiorna estrazioni e pubblica

# Un unico workflow: aggiorna i dati, li committa, POI builda e pubblica il sito
# nello stesso run. Niente handoff a un secondo workflow (era quello a inceppare
# il deploy). Ricostruisce a ogni run, così se un deploy si perde si auto-ripara
# il giorno dopo. Il build usa il working tree appena aggiornato, quindi il sito
# riflette sempre l'ultimo draws.js — anche se il push fallisse.

on:
  schedule:
    # 22:30 CEST (20:30 UTC) - più tardi, per dare tempo alla fonte di pubblicare
    - cron: '30 20 * * *'
  workflow_dispatch:

permissions:
  contents: write   # per committare i dati aggiornati
  pages: write      # per pubblicare su GitHub Pages
  id-token: write   # richiesto da deploy-pages

# Non annullare un deploy in corso: vogliamo che finisca, non che venga ucciso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna-e-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Aggiorna estrazioni dalla fonte
        run: node scripts/update-draws.mjs

      - name: Commit e push se ci sono nuove estrazioni
        run: |
          git config user.name "SONAR Bot"
          git config user.email "actions@github.com"
          git add src/data/draws.js src/data/rank-history.json
          if git diff --staged --quiet; then
            echo "Nessuna nuova estrazione da committare."
          else
            git commit -m "chore: aggiornamento estrazioni $(date -u +'%Y-%m-%d')"
            git push
          fi

      - name: Installa dipendenze
        run: npm install

      - name: Build (usa il draws.js appena aggiornato)
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Carica artefatto
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: aggiorna-e-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pubblica su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
