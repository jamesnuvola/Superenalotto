name: SONAR autonomous research loop
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */4 * * *'
permissions:
  contents: write
concurrency:
  group: sonar-autonomous-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Syntax check
        run: node --check scripts/sonar-strategy-library.mjs && node --check scripts/sonar-research-engine.mjs
      - name: Run autonomous research cycle
        run: START=2700 BUDGET=16 node scripts/sonar-research-engine.mjs
      - name: Commit research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SONAR_research_state.json SONAR_autonomous_research_report.md
          git diff --staged --quiet || git commit -m "Advance autonomous SONAR research queue"
          git push
