name: SONAR SuperEnalotto autonomous research loop
on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
  actions: write
concurrency:
  group: sonar-superenalotto-autonomous-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/sonar-superenalotto-autonomous
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare ESM imports
        run: |
          sed -i "s|'../engine/scoring'|'../engine/scoring.js'|g; s|'./scoring'|'./scoring.js'|g; s|'./dominant-band'|'./dominant-band.js'|g" src/engine/multigen.js src/engine/dominant-band.js
      - name: Syntax check
        run: |
          node --check scripts/sonar-strategy-library.mjs
          node --check scripts/sonar-research-engine.mjs
      - name: Run SuperEnalotto autonomous research cycle
        run: BUDGET=16 node scripts/sonar-research-engine.mjs
      - name: Commit research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SONAR_superenalotto_research_state.json SONAR_superenalotto_autonomous_research_report.md
          if git diff --staged --quiet; then
            echo "No research-state changes to commit."
            exit 0
          fi
          git commit -m "Advance SuperEnalotto persistent DOT queue"
          git pull --rebase origin research/sonar-superenalotto-autonomous
          git push origin HEAD:research/sonar-superenalotto-autonomous
      - name: Trigger next autonomous cycle
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sonar-autonomous-research.yml --ref main
