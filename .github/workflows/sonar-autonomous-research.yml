name: SONAR SuperEnalotto autonomous research loop
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sonar-autonomous-research.yml'
      - 'scripts/**'
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: sonar-superenalotto-autonomous-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Prepare ESM imports
        run: |
          sed -i "s|'../engine/scoring'|'../engine/scoring.js'|g; s|'./scoring'|'./scoring.js'|g; s|'./dominant-band'|'./dominant-band.js'|g" src/engine/multigen.js src/engine/dominant-band.js
      - name: Syntax check
        run: |
          node --check scripts/sonar-strategy-library.mjs
          node --check scripts/sonar-research-engine.mjs
          node --check scripts/sonar-3plus-context-analysis.mjs
          node --check scripts/sonar-next-ticket.mjs
      - name: Run SuperEnalotto autonomous research cycle
        run: BUDGET=16 node scripts/sonar-research-engine.mjs
      - name: Run corrected 3plus context audit
        run: node scripts/sonar-3plus-context-analysis.mjs
      - name: Generate next SONAR ticket candidate
        run: node scripts/sonar-next-ticket.mjs
      - name: Commit research state and current candidate
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add SONAR_superenalotto_research_state.json SONAR_superenalotto_autonomous_research_report.md SONAR_3plus_context_analysis.md SONAR_next_ticket.md
          git diff --staged --quiet || git commit -m "Advance SONAR research and next ticket audit"
          git push
